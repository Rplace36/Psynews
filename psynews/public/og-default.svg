<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a0533"/>
      <stop offset="45%"  stop-color="#0a0a1f"/>
      <stop offset="100%" stop-color="#001a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="50%"  stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="85%" cy="75%" r="45%">
      <stop offset="0%"   stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="60%" cy="10%" r="40%">
      <stop offset="0%"   stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <ellipse cx="240" cy="189" rx="420" ry="420" fill="url(#orb1)" filter="url(#blur1)"/>
  <ellipse cx="1020" cy="472" rx="380" ry="380" fill="url(#orb2)" filter="url(#blur2)"/>
  <ellipse cx="720" cy="63"  rx="340" ry="340" fill="url(#orb3)" filter="url(#blur2)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0"    y1="90"  x2="1200" y2="90"/>
    <line x1="0"    y1="180" x2="1200" y2="180"/>
    <line x1="0"    y1="270" x2="1200" y2="270"/>
    <line x1="0"    y1="360" x2="1200" y2="360"/>
    <line x1="0"    y1="450" x2="1200" y2="450"/>
    <line x1="0"    y1="540" x2="1200" y2="540"/>
    <line x1="120"  y1="0"   x2="120"  y2="630"/>
    <line x1="240"  y1="0"   x2="240"  y2="630"/>
    <line x1="360"  y1="0"   x2="360"  y2="630"/>
    <line x1="480"  y1="0"   x2="480"  y2="630"/>
    <line x1="600"  y1="0"   x2="600"  y2="630"/>
    <line x1="720"  y1="0"   x2="720"  y2="630"/>
    <line x1="840"  y1="0"   x2="840"  y2="630"/>
    <line x1="960"  y1="0"   x2="960"  y2="630"/>
    <line x1="1080" y1="0"   x2="1080" y2="630"/>
  </g>

  <!-- Diamond logo mark -->
  <polygon
    points="100,210 148,245 100,280 52,245"
    fill="none"
    stroke="url(#accent)"
    stroke-width="3"
    opacity="0.9"
  />
  <text
    x="100" y="253"
    font-family="Georgia, serif"
    font-size="28"
    font-weight="bold"
    fill="url(#accent)"
    text-anchor="middle"
    dominant-baseline="middle"
  >P</text>

  <!-- Wordmark -->
  <text
    x="175" y="252"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="52"
    font-weight="bold"
    fill="url(#accent)"
    dominant-baseline="middle"
    letter-spacing="-1"
  >PsyNews</text>

  <!-- Divider line -->
  <rect x="100" y="305" width="520" height="2" fill="url(#accent)" opacity="0.5" rx="1"/>

  <!-- Tagline -->
  <text
    x="100" y="355"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#a8a6c0"
    letter-spacing="0.5"
  >The Psychedelic Intelligence Network</text>

  <!-- Description -->
  <text
    x="100" y="415"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    font-weight="300"
    fill="#6b6985"
  >Independent journalism covering the psychedelic renaissance.</text>
  <text
    x="100" y="445"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    font-weight="300"
    fill="#6b6985"
  >Research · Policy · Culture · Science</text>

  <!-- Category pills -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">
    <!-- Research -->
    <rect x="100" y="495" width="178" height="32" rx="16" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.7"/>
    <text x="189" y="516" fill="#a855f7" text-anchor="middle">Psychedelic Research</text>
    <!-- Policy -->
    <rect x="292" y="495" width="90" height="32" rx="16" fill="none" stroke="#0EA5E9" stroke-width="1.5" opacity="0.7"/>
    <text x="337" y="516" fill="#0EA5E9" text-anchor="middle">Policy</text>
    <!-- Culture -->
    <rect x="396" y="495" width="92" height="32" rx="16" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <text x="442" y="516" fill="#F59E0B" text-anchor="middle">Culture</text>
    <!-- Events -->
    <rect x="502" y="495" width="90" height="32" rx="16" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.7"/>
    <text x="547" y="516" fill="#10B981" text-anchor="middle">Events</text>
    <!-- Books -->
    <rect x="606" y="495" width="84" height="32" rx="16" fill="none" stroke="#EC4899" stroke-width="1.5" opacity="0.7"/>
    <text x="648" y="516" fill="#EC4899" text-anchor="middle">Books</text>
    <!-- Opinion -->
    <rect x="704" y="495" width="96" height="32" rx="16" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.7"/>
    <text x="752" y="516" fill="#EF4444" text-anchor="middle">Opinion</text>
  </g>

  <!-- Decorative hexagon right side -->
  <polygon
    points="980,180 1060,225 1060,315 980,360 900,315 900,225"
    fill="none"
    stroke="url(#accent)"
    stroke-width="1.5"
    opacity="0.15"
  />
  <polygon
    points="980,210 1040,244 1040,312 980,346 920,312 920,244"
    fill="none"
    stroke="url(#accent)"
    stroke-width="1"
    opacity="0.1"
  />
  <!-- Inner dot pattern -->
  <circle cx="980" cy="278" r="4" fill="#7C3AED" opacity="0.4"/>
  <circle cx="950" cy="261" r="2.5" fill="#EC4899" opacity="0.4"/>
  <circle cx="1010" cy="261" r="2.5" fill="#F59E0B" opacity="0.4"/>
  <circle cx="950" cy="295" r="2.5" fill="#06B6D4" opacity="0.4"/>
  <circle cx="1010" cy="295" r="2.5" fill="#7C3AED" opacity="0.4"/>

  <!-- URL watermark -->
  <text
    x="1100" y="600"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="16"
    fill="#6b6985"
    text-anchor="end"
    opacity="0.6"
  >psynews.vercel.app</text>
</svg>
